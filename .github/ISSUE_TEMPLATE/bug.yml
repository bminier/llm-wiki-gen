name: Bug report
description: Report a defect in llm-wiki-gen
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste real PII or secrets** in this issue —
        the synthetic fixtures in `tests/fixtures/pii-samples/` are fine for repros.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps. Include the exact CLI invocation.
      placeholder: |
        1. `llm-wiki-gen sync --json`
        2. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: llm-wiki-gen version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: bun
    attributes:
      label: Bun version
      placeholder: "1.3.x"
  - type: dropdown
    id: os
    attributes:
      label: OS
      options:
        - Linux
        - macOS
        - Windows
        - Other / multiple
    validations:
      required: true
